<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <title>CPR Pose Detection Dual View</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .switch-camera-btn {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      color: white;
      font-size: 24px;
    }

    .switch-camera-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .voice-btn {
      position: absolute;
      bottom: 65px;
      left: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      color: white;
      font-size: 24px;
    }

    .voice-btn i.muted {
      color: gray;
    }

    .voice-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    video,
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (orientation: landscape) {
      .container {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="panel">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <button id="toggleVoice" class="voice-btn">
        <i id="voiceIcon" class="fi fi-rr-megaphone"></i>
      </button>
      <button id="switchCamera" class="switch-camera-btn">
        <i class="fi fi-rr-refresh"></i>
      </button>
    </div>
    <div class="panel">
      <video id="demoVideo" autoplay loop muted playsinline src="/pose/CPR_demonstration.mov"></video>
      <canvas id="demoCanvas"></canvas>
    </div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>

  <script>
    function setupPose(videoElement, canvasElement, poseInstance, pressPathName, pressTimestampsName, pressStartTimeName) {
      const ctx = canvasElement.getContext("2d");

      if (!window.frameTimes) window.frameTimes = [];

      function resizeCanvas() {
        if (videoElement.videoWidth && videoElement.videoHeight) {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
        }
      }

      videoElement.addEventListener("loadedmetadata", resizeCanvas);
      window.addEventListener("resize", resizeCanvas);

      function getBoxDimensions() {
        const boxMarginRatio = 0.2;
        const width = canvasElement.width;
        const height = canvasElement.height;
        const boxX = width * boxMarginRatio;
        const boxY = height * boxMarginRatio;
        const boxWidth = width * (1 - 2 * boxMarginRatio);
        const boxHeight = height * (1 - 2 * boxMarginRatio);
        return { boxX, boxY, boxWidth, boxHeight };
      }

      function midpoint(p1, p2) {
        return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      }

      function calcAngle(a, b, c) {
        const ab = [b.x - a.x, b.y - a.y];
        const cb = [b.x - c.x, b.y - c.y];
        const dot = ab[0] * cb[0] + ab[1] * cb[1];
        const magAB = Math.hypot(ab[0], ab[1]);
        const magCB = Math.hypot(cb[0], cb[1]);
        return (Math.acos(dot / (magAB * magCB)) * 180) / Math.PI;
      }

      function isArmVertical(shoulder, wrist) {
        const dx = shoulder.x - wrist.x;
        const dy = shoulder.y - wrist.y;
        const angle = Math.abs((Math.atan2(dy, dx) * 180) / Math.PI);
        return angle > 70 && angle < 110;
      }

      function areElbowsTogether(le, re, threshold = 0.2) {
        const dx = le.x - re.x;
        const dy = le.y - re.y;
        return Math.hypot(dx, dy) < threshold;
      }

      function smoothPath(path, k = 5) {
        const smoothed = [];
        for (let i = 0; i < path.length; i++) {
          let xSum = 0, ySum = 0, count = 0;
          for (let j = i - Math.floor(k / 2); j <= i + Math.floor(k / 2); j++) {
            if (path[j]) {
              xSum += path[j].x;
              ySum += path[j].y;
              count++;
            }
          }
          smoothed.push({ x: xSum / count, y: ySum / count });
        }
        return smoothed;
      }

      function findExtrema(yVals) {
        const peaks = [];
        for (let i = 1; i < yVals.length - 1; i++) {
          if (yVals[i] > yVals[i - 1] && yVals[i] > yVals[i + 1]) peaks.push({ type: "max", y: yVals[i], index: i });
          if (yVals[i] < yVals[i - 1] && yVals[i] < yVals[i + 1]) peaks.push({ type: "min", y: yVals[i], index: i });
        }
        return peaks;
      }

      function onResults(results) {
        resizeCanvas();
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        const { boxX, boxY, boxWidth, boxHeight } = getBoxDimensions();
        ctx.strokeStyle = "green";
        ctx.lineWidth = 6;
        ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

        if (!results.poseLandmarks) return;

        const now = performance.now();
        window.frameTimes.push(now);
        if (window.frameTimes.length > 60) window.frameTimes.shift();

        let textLine = 60;
        const drawLine = (text, color = "white") => {
          ctx.fillStyle = color;
          ctx.font = `${canvasElement.height * 0.04}px Arial`;
          ctx.fillText(text, 20, textLine);
          textLine += canvasElement.height * 0.05;
        };

        const lm = results.poseLandmarks;
        const ls = lm[11], rs = lm[12];
        const le = lm[13], re = lm[14];
        const lw = lm[15], rw = lm[16];

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(ls.x * canvasElement.width, ls.y * canvasElement.height);
        ctx.lineTo(le.x * canvasElement.width, le.y * canvasElement.height);
        ctx.lineTo(lw.x * canvasElement.width, lw.y * canvasElement.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(rs.x * canvasElement.width, rs.y * canvasElement.height);
        ctx.lineTo(re.x * canvasElement.width, re.y * canvasElement.height);
        ctx.lineTo(rw.x * canvasElement.width, rw.y * canvasElement.height);
        ctx.stroke();

        const leftAngle = calcAngle(ls, le, lw);
        const rightAngle = calcAngle(rs, re, rw);

        drawLine("左肘角度: " + leftAngle.toFixed(1));
        drawLine("右肘角度: " + rightAngle.toFixed(1));

        if (leftAngle < 160 || rightAngle < 160) {
          drawLine("⚠️ 手肘未打直", "yellow");
          playVoiceAlert("elbow");
        }

        if (!window.wristNotUnderShoulderStart) window.wristNotUnderShoulderStart = null;

        const wristNotUnderShoulder = !isArmVertical(ls, lw) || !isArmVertical(rs, rw);

        if (wristNotUnderShoulder) {
          if (!window.wristNotUnderShoulderStart) window.wristNotUnderShoulderStart = now;
          const duration = now - window.wristNotUnderShoulderStart;
          if (duration >= 5000) drawLine("⚠️ 手腕未在肩膀正下方（超過5秒）", "yellow");
        } else window.wristNotUnderShoulderStart = null;

        if (!areElbowsTogether(le, re)) drawLine("⚠️ 雙手未交疊", "yellow");

        if (!window[pressPathName]) window[pressPathName] = [];
        const pressPoint = midpoint(lw, rw);
        window[pressPathName].push({ x: pressPoint.x * canvasElement.width, y: pressPoint.y * canvasElement.height });
        if (window[pressPathName].length > 60) window[pressPathName].shift();

        const smoothedPath = smoothPath(window[pressPathName]);
        const yValues = smoothedPath.map(p => p.y);
        const extrema = findExtrema(yValues);

        const depths = [];
        for (let i = 1; i < extrema.length - 1; i++) {
          const prev = extrema[i - 1], curr = extrema[i], next = extrema[i + 1];
          if (prev.type === "max" && curr.type === "min" && next.type === "max") {
            const depth = Math.max(prev.y - curr.y, next.y - curr.y);
            depths.push(depth);
          }
        }

        if (depths.length > 0) {
          const avgDepth = depths.reduce((a, b) => a + b, 0) / depths.length;
          const stdDepth = Math.sqrt(depths.reduce((sum, d) => sum + Math.pow(d - avgDepth, 2), 0) / depths.length);
          if (stdDepth > 15) {
            drawLine("⚠️ 壓胸深度不穩定", "yellow");
            playVoiceAlert("deep");
          }
        } else drawLine("⚠️ 無法判斷壓胸深度（動作過少）", "yellow");
      }

      poseInstance.onResults(onResults);
    }

    // 聲音控制
    let voiceEnabled = false;
    let lastVoiceTime = 0;
    const VOICE_COOLDOWN = 2600;

    const sounds = {
      elbow: new Audio("/radio/elbow.mp3"),
      hands: new Audio("/radio/hands.mp3"),
      wrist: new Audio("/radio/wrist.mp3"),
      slow: new Audio("/radio/slow.mp3"),
      quick: new Audio("/radio/quick.mp3"),
      deep: new Audio("/radio/deep.mp3")
    };

    const toggleVoiceBtn = document.getElementById("toggleVoice");
    const voiceIcon = document.getElementById("voiceIcon");
    voiceIcon.classList.add("muted");

    toggleVoiceBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      if (voiceEnabled) voiceIcon.classList.remove("muted");
      else voiceIcon.classList.add("muted");
    });

    function playVoiceAlert(type) {
      if (!voiceEnabled) return;
      const now = Date.now();
      if (now - lastVoiceTime < VOICE_COOLDOWN) return;
      if (sounds[type]) {
        sounds[type].currentTime = 0;
        sounds[type].play();
        lastVoiceTime = now;
      }
    }

    // Camera
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const pose = new Pose({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 2, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.7 });
    setupPose(video, canvas, pose, "pressPath", "pressTimestamps", "pressStartTime");

    let currentFacingMode = "user";
    let camera;

    async function startCamera(facingMode) {
      if (camera) await camera.stop();
      camera = new Camera(video, { onFrame: async () => await pose.send({ image: video }), width: 640, height: 480, facingMode });
      camera.start();
    }

    document.getElementById("switchCamera").addEventListener("click", () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      startCamera(currentFacingMode);
    });

    startCamera(currentFacingMode);

    // Demo video
    const demoVideo = document.getElementById("demoVideo");
    const demoCanvas = document.getElementById("demoCanvas");
    const pose2 = new Pose({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose2.setOptions({ modelComplexity: 2, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.7 });
    setupPose(demoVideo, demoCanvas, pose2, "pressPath2", "pressTimestamps2", "pressStartTime2");
    demoVideo.playbackRate = 0.82;

    demoVideo.onplay = function loopDetection() {
      requestAnimationFrame(async () => {
        await pose2.send({ image: demoVideo });
        loopDetection();
      });
    };
  </script>
</body>

</html>
